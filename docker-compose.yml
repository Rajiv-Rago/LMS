services:
  # MongoDB — always available (dev and prod)
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --eval "db.runCommand('ping').ok" --quiet
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Production app — only runs with `--profile prod`
  app:
    build: .
    profiles: [prod]
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGODB_URI=mongodb://mongo:27017/kantigo
      - NODE_ENV=production

volumes:
  mongo-data:
